<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Map of India with Image Pin Marker</title>
</head>
<body>
    <h1>Map of India - Mark Your Spot!</h1>
    
    <div class="map-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/26/Map_of_India.png" alt="Map of India" class="map-image">
        <img class="pin" src="./assets/pin.png" alt="New Delhi Location Pin">
        <div class="tooltip">
            <strong>New Delhi, India</strong><br>
            The bustling capital. Home to the Red Fort and Taj Mahal nearby!
        </div>
    </div>
</body>
</html>
